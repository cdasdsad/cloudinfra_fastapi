<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>members.html</title>
</head>

<body>
    <div class="container">
        <h1>회원목록</h1>
        <table>
            <thead>
                <tr>
                    <th>번호</th>
                    <th>이름</th>
                    <th>주소</th>
                </tr>
            </thead>
            <tbody>
                {% for item in list %}
                <tr>
                    <th>{{ item.num }}</th>
                    <th>{{ item.name }}</th>
                    <th>{{ item.addr }}</th>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>

</html>
